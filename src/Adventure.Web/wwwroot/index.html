<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>Choose Your Champion</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: #0b1020; color: #fff; display: grid; place-items: center; }
    main { width: min(680px, 100%); padding: 28px 20px 40px; }
    h1 { font-size: clamp(2rem, 8vw, 3.4rem); line-height: .95; margin: 0 0 10px; text-align: center; }
    .sub { color: #94a3b8; text-align: center; margin-bottom: 20px; }
    .status { text-align: center; color: #f8d866; min-height: 3em; margin: 8px 0 20px; font-weight: 700; }
    .grid { display: grid; gap: 14px; }
    .champion { width: 100%; min-height: 108px; border: 2px solid #475569; border-radius: 18px; background: #111827; color: #fff; padding: 18px; text-align: left; cursor: pointer; transition: opacity .18s ease, border-color .18s ease, background .18s ease, transform .18s ease; }
    .champion:disabled { cursor: not-allowed; opacity: .45; }
    .champion:not(:disabled):active, .champion.selected { border-color: #f8d866; background: #172033; }
    .champion.winner { border-color: #f8d866; background: #2a2411; transform: scale(1.015); }
    .champion.loser { opacity: .30; }
    .name { display: block; font-size: 1.25rem; font-weight: 800; }
    .tag { display: block; color: #cbd5e1; margin-top: 6px; }
    .votes { display: block; color: #f8d866; margin-top: 10px; font-weight: 700; }
    footer { color: #64748b; text-align: center; margin-top: 24px; font-size: .9rem; }
    #racePanel { display: none; text-align: center; }
    .team-badge { margin: 0 auto 18px; border: 2px solid #475569; background: #111827; border-radius: 18px; padding: 18px; }
    .team-badge strong { display: block; font-size: 1.5rem; color: #f8d866; margin-top: 5px; }
    .boost { width: 100%; min-height: 180px; border: 0; border-radius: 28px; background: #f8d866; color: #111827; font-size: clamp(2rem, 10vw, 4rem); font-weight: 1000; cursor: pointer; touch-action: manipulation; box-shadow: inset 0 -8px 0 rgba(0,0,0,.18); }
    .boost:active { transform: translateY(5px); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
    .boost:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .tap-count { margin-top: 14px; color: #cbd5e1; font-weight: 700; }
    .race-result { margin-top: 14px; font-size: 1.2rem; font-weight: 800; color: #f8d866; min-height: 2em; }
  </style>
</head>
<body>
  <main>
    <section id="votePanel">
      <h1>CHOOSE YOUR CHAMPION</h1>
      <p class="sub">Your vote shapes the rest of the adventure — and decides which team you race for later.</p>
      <div id="status" class="status">Connecting…</div>
      <div class="grid">
        <button class="champion" type="button" data-champion="RacingDriver"><span class="name">🏎️ THE DRIVER</span><span class="tag">Speed. Precision. Questionable braking.</span><span class="votes" id="driverVotes">0 votes</span></button>
        <button class="champion" type="button" data-champion="Charioteer"><span class="name">🛡️ THE CHARIOTEER</span><span class="tag">Glory. Courage. Undefined behaviour.</span><span class="votes" id="chariotVotes">0 votes</span></button>
        <button class="champion" type="button" data-champion="SpacePilot"><span class="name">🚀 THE SPACE PILOT</span><span class="tag">Exploration. Thrusters. Naturally, Orbit.</span><span class="votes" id="pilotVotes">0 votes</span></button>
      </div>
    </section>

    <section id="racePanel">
      <h1>RACE YOUR CHAMPION</h1>
      <p class="sub">Every tap pushes your original champion closer to the finish line.</p>
      <div class="team-badge">You are racing for<strong id="teamName">YOUR TEAM</strong></div>
      <button id="boostButton" class="boost" type="button" disabled>BOOST!</button>
      <div id="raceStatus" class="status">Waiting for the presenter to start the race…</div>
      <div id="tapCount" class="tap-count">0 taps</div>
      <div id="raceResult" class="race-result"></div>
    </section>

    <footer id="session"></footer>
  </main>
  <script src="/js/signalr/dist/browser/signalr.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = (params.get('session') || 'ORBIT').toUpperCase();
    const status = document.getElementById('status');
    const votePanel = document.getElementById('votePanel');
    const racePanel = document.getElementById('racePanel');
    const buttons = [...document.querySelectorAll('button[data-champion]')];
    const boostButton = document.getElementById('boostButton');
    const raceStatus = document.getElementById('raceStatus');
    const raceResult = document.getElementById('raceResult');
    const tapCount = document.getElementById('tapCount');
    const teamName = document.getElementById('teamName');
    const participantId = localStorage.getItem('orbit-participant') || crypto.randomUUID();
    localStorage.setItem('orbit-participant', participantId);
    document.getElementById('session').textContent = `Session: ${sessionId}`;

    let latestSnapshot = null;
    let latestRace = null;
    let taps = 0;
    let pendingTaps = 0;
    let selectedChampion = localStorage.getItem(`orbit-vote-${sessionId}`);

    const labels = {
      RacingDriver: '🏎️ THE DRIVER',
      Charioteer: '🛡️ THE CHARIOTEER',
      SpacePilot: '🚀 THE SPACE PILOT'
    };

    const connection = new signalR.HubConnectionBuilder()
      .withUrl('/adventureHub')
      .withAutomaticReconnect()
      .build();

    function phaseName(phase) {
      if (typeof phase === 'string') return phase;
      return ['Ready', 'Open', 'Closed', 'Revealed'][phase] || 'Ready';
    }

    function racePhaseName(phase) {
      if (typeof phase === 'string') return phase;
      return ['Ready', 'Racing', 'Finished'][phase] || 'Ready';
    }

    function championName(value) {
      if (value == null) return null;
      if (typeof value === 'string') return value;
      return ({ 20: 'RacingDriver', 50: 'Charioteer', 80: 'SpacePilot' })[value] || null;
    }

    function applySnapshot(snapshot) {
      latestSnapshot = snapshot;
      document.getElementById('driverVotes').textContent = `${snapshot.racingDriver} vote${snapshot.racingDriver === 1 ? '' : 's'}`;
      document.getElementById('chariotVotes').textContent = `${snapshot.charioteer} vote${snapshot.charioteer === 1 ? '' : 's'}`;
      document.getElementById('pilotVotes').textContent = `${snapshot.spacePilot} vote${snapshot.spacePilot === 1 ? '' : 's'}`;

      const phase = phaseName(snapshot.phase);
      const revealed = championName(snapshot.revealedChampion);

      buttons.forEach(button => {
        button.disabled = phase !== 'Open';
        button.classList.toggle('selected', button.dataset.champion === selectedChampion && phase !== 'Revealed');
        button.classList.toggle('winner', phase === 'Revealed' && revealed === button.dataset.champion);
        button.classList.toggle('loser', phase === 'Revealed' && revealed && revealed !== button.dataset.champion);
      });

      if (phase === 'Ready') {
        status.textContent = 'You’re in! Waiting for the presenter to open voting…';
      } else if (phase === 'Open') {
        status.textContent = selectedChampion
          ? 'Voting is open — your vote is in, but you can still change it.'
          : 'Voting is open — choose your champion!';
      } else if (phase === 'Closed') {
        status.textContent = 'Voting is closed. The result is locked…';
      } else if (phase === 'Revealed' && revealed) {
        status.textContent = revealed === selectedChampion
          ? '🎉 Your champion won! Keep this page open — you’ll race for them later.'
          : 'The audience has chosen. Keep this page open — your champion still races later!';
      } else if (phase === 'Revealed') {
        status.textContent = 'It’s a tie! Waiting for one more round…';
      }
    }

    function applyRace(snapshot) {
      latestRace = snapshot;
      const phase = racePhaseName(snapshot.phase);
      const winner = championName(snapshot.winner);

      if (phase === 'Ready') {
        // Keep the voting/result screen visible until the presenter actually starts the race.
        racePanel.style.display = 'none';
        votePanel.style.display = 'block';
        return;
      }

      votePanel.style.display = 'none';
      racePanel.style.display = 'block';
      const label = selectedChampion ? labels[selectedChampion] : 'YOUR ORIGINAL CHAMPION';
      teamName.textContent = label;

      if (phase === 'Racing') {
        boostButton.disabled = false;
        raceStatus.textContent = 'GO! Tap as fast as you can!';
        raceResult.textContent = '';
      } else {
        boostButton.disabled = true;
        raceStatus.textContent = 'FINISH!';
        raceResult.textContent = winner === selectedChampion
          ? '🏆 YOUR TEAM WON!'
          : `${labels[winner] || 'A champion'} wins the race!`;
      }
    }

    connection.on('VoteUpdated', applySnapshot);
    connection.on('RaceUpdated', applyRace);
    connection.onreconnecting(() => {
      status.textContent = 'Reconnecting…';
      raceStatus.textContent = 'Reconnecting…';
      boostButton.disabled = true;
    });
    connection.onreconnected(async () => {
      await connection.invoke('JoinSession', sessionId);
    });

    buttons.forEach(button => {
      button.addEventListener('click', async () => {
        if (connection.state !== signalR.HubConnectionState.Connected) return;
        if (!latestSnapshot || phaseName(latestSnapshot.phase) !== 'Open') return;

        selectedChampion = button.dataset.champion;
        localStorage.setItem(`orbit-vote-${sessionId}`, selectedChampion);
        buttons.forEach(x => x.classList.toggle('selected', x === button));
        await connection.invoke('Vote', sessionId, participantId, selectedChampion);
        status.textContent = 'Vote received — you can change it while voting remains open.';
      });
    });

    boostButton.addEventListener('click', async () => {
      if (connection.state !== signalR.HubConnectionState.Connected) return;
      if (!latestRace || racePhaseName(latestRace.phase) !== 'Racing') return;

      taps += 1;
      pendingTaps += 1;
      tapCount.textContent = `${taps} tap${taps === 1 ? '' : 's'}`;
    });

    // Batch frantic tapping into at most ten SignalR calls per second per browser.
    // The local tap count still responds immediately, while the server remains authoritative.
    setInterval(async () => {
      if (pendingTaps <= 0) return;
      if (connection.state !== signalR.HubConnectionState.Connected) return;
      if (!latestRace || racePhaseName(latestRace.phase) !== 'Racing') return;

      const batch = Math.min(pendingTaps, 20);
      pendingTaps -= batch;
      try {
        await connection.invoke('Boost', sessionId, participantId, batch);
      } catch {
        pendingTaps += batch;
      }
    }, 100);

    async function start() {
      try {
        await connection.start();
        status.textContent = 'Connected · synchronising…';
        await connection.invoke('JoinSession', sessionId);
      } catch {
        status.textContent = 'Unable to connect. Retrying…';
        setTimeout(start, 1500);
      }
    }

    start();
  </script>
</body>
</html>
